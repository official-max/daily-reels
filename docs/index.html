<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b0b2e">
<title>Video Plan: Kaun si video kab aayegi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#1b0b2e;--plum:#2a1245;--panel:#33174f;--line:#57327a;--ink:#fff4e0;--soft:#cdb3da;--gold:#ffc24a;--marigold:#ff8a2a;--rose:#ff5d7e;--leaf:#5fe0a0;--head:"Baloo 2",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--ink);font:17px/1.5 Mukta,system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
/* hero */
.hero{position:relative;padding:54px 0 64px;background:radial-gradient(90% 120% at 78% 40%,#ff8a2a 0,#c43a4a 30%,#5a1a66 60%,var(--night) 100%);overflow:hidden}
.mandala{position:absolute;right:-150px;top:50%;width:640px;height:640px;margin-top:-320px;opacity:.55;animation:turn 120s linear infinite}
.hero .wrap{position:relative;display:grid;gap:30px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}
.hero h1{font-size:clamp(38px,6.4vw,68px);font-weight:800;text-shadow:0 4px 24px #0006}
.hero p{margin:10px 0 0;font-size:19px;max-width:34ch;color:#ffe9d2}
.stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:26px}
.stats b{display:block;font:800 32px/1 var(--head);color:var(--gold)}
.stats span{font-size:15px;color:#ffe9d2}
.next{background:#1b0b2ed9;border:1px solid #ffffff2e;border-radius:26px;padding:24px;box-shadow:0 24px 60px #0007}
.next .lab{font-weight:700;color:var(--gold)}
.next h2{font-size:clamp(21px,2.6vw,27px);margin:6px 0 16px;overflow-wrap:anywhere}
.clock{display:flex;gap:10px}
.clock div{flex:1;background:var(--panel);border-radius:16px;padding:12px 4px;text-align:center;min-width:0}
.clock b{display:block;font:800 clamp(28px,5vw,42px)/1 var(--head);font-variant-numeric:tabular-nums}
.clock span{font-size:14px;color:var(--soft)}
/* sections */
section{padding:46px 0 6px}
.top{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-bottom:18px}
.top h2{font-size:clamp(26px,3.6vw,36px)}
.top p{margin:0;color:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;border-radius:99px;padding:4px 12px;background:#ffffff14}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.ok{color:var(--leaf)}.wait{color:var(--gold)}.off{color:var(--soft)}
/* coming: day rows */
.days{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.day{background:var(--plum);border:1px solid var(--line);border-radius:22px;padding:18px 18px 8px}
.day.today{border-color:var(--gold);background:linear-gradient(160deg,#5b2348,var(--plum) 60%)}
.day h3{font-size:21px;margin-bottom:6px}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid #ffffff1c}
.slot time{font:700 18px/1.4 var(--head);color:var(--gold);font-variant-numeric:tabular-nums}
.slot p{margin:0 0 6px;font-weight:500;overflow-wrap:anywhere}
.slot.live p{font-weight:700}
/* rails */
.rail{display:flex;gap:16px;overflow-x:auto;padding:4px 18px 18px;margin:0 -18px;scroll-snap-type:x proximity;scrollbar-color:var(--line) transparent}
.rail>*{flex:0 0 auto;scroll-snap-align:start;scroll-margin-left:18px}
.vid{width:186px;text-decoration:none;color:inherit}
.vid .pic{position:relative;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:var(--panel);box-shadow:0 10px 28px #0006}
.vid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.vid:hover img{transform:scale(1.06)}
.vid .play{position:absolute;right:12px;bottom:12px;width:46px;height:46px;border-radius:50%;background:var(--marigold);display:grid;place-items:center;box-shadow:0 4px 14px #0008}
.vid .play::after{content:"";margin-left:4px;border-left:15px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
.vid .part{position:absolute;left:12px;bottom:20px;background:#1b0b2ecc;border-radius:99px;padding:2px 11px;font-weight:700;font-size:14px}
.vid h3{font-size:18px;margin:11px 2px 2px}
.vid p{margin:0 2px;font-size:14px;color:var(--soft)}
/* week of series */
.week{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,235px),1fr))}
.card{position:relative;aspect-ratio:5/7;border-radius:26px;overflow:hidden;display:flex;align-items:flex-end;isolation:isolate;box-shadow:0 14px 34px #0006}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s}
.card:hover img{transform:scale(1.05)}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(#0000 40%,#160724f5 88%)}
.card .in{padding:18px;width:100%}
.card .d{position:absolute;left:14px;top:14px;background:var(--gold);color:#33104a;font:800 16px/1 var(--head);padding:8px 14px 6px;border-radius:99px}
.card.today{outline:4px solid var(--gold);outline-offset:3px}
.card h3{font-size:25px}
.card p{margin:2px 0 8px;font-size:15px;color:#f0dcf2}
@media (min-width:1000px){.week{grid-template-columns:repeat(12,minmax(0,1fr))}.card{grid-column:span 3}.card:nth-child(n+5){grid-column:span 4;aspect-ratio:1}.card:nth-child(n+5) img{object-position:50% 20%}.card:nth-child(5) img{object-position:50% 90%}}
/* path */
.path{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.path li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;align-items:center;background:var(--plum);border:1px solid var(--line);border-radius:20px;padding:14px}
.path .n{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:800 22px/1 var(--head);background:var(--panel);color:var(--soft)}
.path .done .n{background:var(--leaf);color:#06331e}
.path .now{border-color:var(--marigold);background:linear-gradient(120deg,#7a2a35,var(--plum))}
.path .now .n{background:var(--marigold);color:#fff}
.path h3{font-size:18px}
.path p{margin:2px 0 0;font-size:15px;color:var(--soft)}
.bar{height:14px;border-radius:99px;background:var(--panel);overflow:hidden;margin:0 0 18px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--marigold),var(--gold))}
.msg{background:var(--plum);border-radius:20px;padding:20px}
footer{padding:44px 18px 50px;text-align:center;color:var(--soft);font-size:15px}
@keyframes turn{to{transform:rotate(360deg)}}
@media (max-width:820px){.hero{padding:40px 0 46px}.hero .wrap{grid-template-columns:minmax(0,1fr)}.mandala{right:-300px;top:30%}}
@media (max-width:520px){.week{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border-radius:20px}.card .in{padding:12px}.card h3{font-size:19px}.card p{font-size:13px}.card .d{left:10px;top:10px;font-size:14px}.card .chip{font-size:12px;padding:3px 9px}.vid{width:158px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero">
<svg class="mandala" viewBox="-200 -200 400 400" fill="none" stroke="#ffd98a" stroke-width="1.6" aria-hidden="true" id="mandala"></svg>
<div class="wrap">
<div><h1>Aaj kya dekhenge?</h1><p>Nayi videos ka poora plan: kya aa chuka, kya aane wala hai.</p><div class="stats" id="stats"></div></div>
<div class="next" id="next"><span class="lab">Agli video</span><h2>Load ho raha hai...</h2></div>
</div>
</header>
<main class="wrap" id="app"></main>
<footer id="foot"></footer>
<script>
const RAW = "https://raw.githubusercontent.com/official-max/daily-reels/main/", SLOTS = ["12:00", "16:00", "19:00"];
const DIN = ["Ravivaar", "Somvaar", "Mangalvaar", "Budhvaar", "Guruvaar", "Shukravaar", "Shanivaar"], KIND = {paheli: "Paheli", devotional: "Krishna katha"};
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const $ = id => document.getElementById(id);
// text only ever goes in as text, never as HTML
function el(tag, cls, text, ...kids) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; e.append(...kids.filter(k => k != null)); return e; }
function url(a, u) { if (/^https:\/\//.test(u)) { a.href = u; a.target = "_blank"; a.rel = "noopener"; } return a; }
function pic(src, alt, back) { const i = el("img"); i.loading = "lazy"; i.alt = alt; i.src = src; const miss = () => { i.onerror = i.onload = null; if (back) i.src = back; else i.remove(); }; i.onerror = miss; if (back) i.onload = () => { if (i.naturalWidth <= 120) miss(); }; return i; }
async function get(p) { const r = await fetch(RAW + p); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }
const at = (d, s) => new Date(d + "T" + s + ":00+05:30"), ist = t => new Date(t.getTime() + 330 * 60000), day = t => ist(t).toISOString().slice(0, 10);
const utc = d => new Date(d + "T00:00:00Z"), plus = (d, n) => { const x = utc(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const short = d => { const x = utc(d); return `${x.getUTCDate()} ${MON[x.getUTCMonth()]}`; }, wday = d => (utc(d).getUTCDay() + 6) % 7;
const clock = s => { const h = +s.slice(0, 2); return `${h % 12 || 12} ${h < 12 ? "AM" : "PM"}`; };
const okId = v => /^[\w-]{11}$/.test(v || ""), clean = t => String(t || "").replace(/#shorts/i, "").trim();
const chip = (c, t) => el("span", "chip " + c, t);
const head = (t, n) => el("div", "top", null, el("h2", "", t), n ? el("p", "", n) : null);

{ // mandala
  const NS = "http://www.w3.org/2000/svg", add = (t, o) => { const e = document.createElementNS(NS, t); for (const k in o) e.setAttribute(k, o[k]); $("mandala").append(e); };
  [196, 188, 120, 62, 24].forEach(r => add("circle", {r}));
  [[12, 62, 24, 12], [24, 120, 62, 14], [36, 188, 120, 13]].forEach(([n, R, r, w]) => { for (let i = 0; i < n; i++) add("path", {d: `M0 ${-r}C${w} ${-(r + R) / 2} ${w} ${-(r + R) / 2} 0 ${-R}C${-w} ${-(r + R) / 2} ${-w} ${-(r + R) / 2} 0 ${-r}`, transform: `rotate(${i * 360 / n})`}); });
}

function countdown(when, title, ready) {
  const box = $("next"), c = el("div", "clock"), parts = ["ghante", "minute", "second"].map(t => { const b = el("b", "", "00"); c.append(el("div", "", null, b, el("span", "", t))); return b; });
  box.replaceChildren(el("span", "lab", `Agli video, ${day(when) === day(new Date()) ? "aaj" : short(day(when))} ${clock(ist(when).toISOString().slice(11, 16))}`), el("h2", "", title), c);
  const tick = () => { const s = Math.max(0, Math.floor((when - Date.now()) / 1000)); [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].forEach((v, i) => parts[i].textContent = String(v).padStart(2, "0")); if (!s) { clearInterval(id); setTimeout(() => location.reload(), 60000); } };
  const id = setInterval(tick, 1000); tick();
}

function daily(hist, state) {
  const now = new Date(), today = day(now), done = {}, out = [];
  hist = hist.filter(h => h.date && SLOTS.includes(h.slot)); hist.forEach(h => done[h.date + h.slot] = h);
  const a = state.active, wait = a ? `${a.series_title || "Nayi kahani"}, part ${(a.next || 0) + 1}` : state.last_kind === "devotional" ? "Nayi paheli" : "Nayi Krishna katha";
  const days = el("div", "days"); let first = true;
  for (let i = 0; i < 3; i++) {
    const d = plus(today, i), box = el("div", "day" + (i ? "" : " today"), null, el("h3", "", i === 0 ? `Aaj, ${short(d)}` : i === 1 ? `Kal, ${short(d)}` : `${DIN[utc(d).getUTCDay()]}, ${short(d)}`));
    for (const s of SLOTS) {
      const h = done[d + s], gone = at(d, s) <= now; if (gone && !h) continue;
      const t = h ? clean(h.title) : first ? `${wait} (ban rahi hai)` : "Kahani chuni ja rahi hai";
      if (!gone && first) { countdown(at(d, s), h ? clean(h.title) : wait); }
      box.append(el("div", "slot" + (!gone && first ? " live" : ""), null, el("time", "", clock(s)), el("div", "", null, el("p", "", h ? clean(h.title) : "Kahani aani baaki"), gone ? chip("off", "Aa gayi") : h ? chip("ok", "Taiyar") : chip("wait", "Banegi")))); if (!gone) first = false;
    }
    days.append(box);
  }
  out.push(el("section", "", null, head("Aane wali videos", "Roz 12 PM, 4 PM aur 7 PM"), days));
  const past = hist.filter(h => at(h.date, h.slot) <= now).sort((x, y) => at(y.date, y.slot) - at(x.date, x.slot)), rail = el("div", "rail");
  for (const h of past.slice(0, 18)) {
    if (!okId(h.video_id)) continue;
    const p = el("div", "pic", null, pic(`https://i.ytimg.com/vi/${h.video_id}/maxresdefault.jpg`, "", `https://i.ytimg.com/vi/${h.video_id}/mqdefault.jpg`), el("span", "play"), h.part ? el("span", "part", "Part " + h.part) : null);
    rail.append(url(el("a", "vid", null, p, el("h3", "", h.series || clean(h.title)), el("p", "", `${KIND[h.type] || ""}, ${short(h.date)}`)), "https://youtube.com/shorts/" + h.video_id));
  }
  rail.tabIndex = 0; rail.setAttribute("aria-label", "Pichhli videos");
  out.push(el("section", "", null, head("Abhi dekho", "Dabao, YouTube par khulegi"), rail));
  $("stats").replaceChildren(...[[past.length, "video aa chuki"], [new Set(past.map(h => h.series)).size, "kahaniyan"], [SLOTS.length, "video roz"]].map(([n, t]) => el("div", "", null, el("b", "", n), el("span", "", t))));
  return out;
}

function channel(ch, lists) {
  const today = day(new Date()), wk = el("div", "week"), out = [];
  out.push(el("section", "", null, head("Naya Mythology channel", ch.start ? `Shuru: ${short(ch.start)}` : "Jald aa raha hai. Har din ek nayi mahagatha."), wk));
  for (const x of ch.series) {
    const parts = lists[x.file] || [], n = parts.find(p => !p.video_id);
    wk.append(el("article", "card" + (x.day === wday(today) ? " today" : ""), null, pic(`img/${x.day}.jpg`, ""), el("span", "d", x.din), el("div", "in", null, el("h3", "", x.naam), el("p", "", x.granth), n ? chip("wait", `Bhaag ${n.bhaag}: ${n.naam}`) : chip("off", parts.length ? "List poori" : "Kahani chun rahe hain"))));
    if (!parts.length) continue;
    let d = null; if (ch.start) { d = ch.start > today ? ch.start : today; d = plus(d, (x.day - wday(d) + 7) % 7); }
    const ol = el("ol", "path"), dn = parts.filter(p => p.video_id).length;
    for (const p of parts) {
      const seen = okId(p.video_id), k = p.video_id ? (p.date ? short(p.date) : "") : d ? short(d) : ""; if (!p.video_id && d) d = plus(d, 7);
      const info = el("p", "", null, url(el("a", "", `${p.kaand} kaand, sarg ${p.sarg}`), p.link)); if (k) info.append(`, ${k}`); if (p === n) info.append(" · ", "Agla"); if (seen) info.append(" · ", url(el("a", "", "Dekho"), "https://youtube.com/shorts/" + p.video_id));
      ol.append(el("li", p.video_id ? "done" : p === n ? "now" : "", null, el("span", "n", p.bhaag), el("div", "", null, el("h3", "", p.naam), info)));
    }
    const bar = el("i"); bar.style.width = Math.max(2, dn / parts.length * 100) + "%";
    out.push(el("section", "", null, head(`${x.naam}: saare bhaag`, `${parts.length} mein se ${dn} bhaag aa chuke`), el("div", "bar", null, bar), ol));
  }
  return out;
}

(async () => {
  const out = [], bad = t => el("section", "", null, el("p", "msg", t)), again = "Thodi der mein page dobara kholo.";
  try { const [h, st] = await Promise.all([get("state/history.json"), get("state/series.json")]); out.push(...daily(h, st)); }
  catch (e) { $("next").replaceChildren(el("span", "lab", "Agli video"), el("h2", "", "Data abhi nahi khula")); out.push(bad("Videos ki list abhi nahi khuli. " + again)); }
  try {
    const ch = await get("plan/channel.json"), lists = {};
    await Promise.all(ch.series.filter(x => x.file).map(async x => { try { lists[x.file] = await get("plan/" + x.file); } catch (e) {} }));
    out.push(...channel(ch, lists));
  } catch (e) { out.push(bad("Naye channel ka plan abhi nahi khula. " + again)); }
  $("app").replaceChildren(...out); $("foot").textContent = "Ye page har nayi video ke saath apne aap badalta hai.";
})();
</script>
</body>
</html>
