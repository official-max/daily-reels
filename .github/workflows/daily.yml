name: Daily Reel

on:
  schedule:
    # 3 videos a day. Each run starts 3 hours before its publish time (IST = UTC + 5:30).
    - cron: "30 3 * * *"    #  9:00 AM IST -> publish 12:00 PM
    - cron: "30 7 * * *"    #  1:00 PM IST -> publish  4:00 PM
    - cron: "30 10 * * *"   #  4:00 PM IST -> publish  7:00 PM
  workflow_dispatch:
    inputs:
      type:
        description: "auto / paheli / devotional (paheli or devotional starts a new series of that kind)"
        default: "auto"
      upload:
        description: "Upload to YouTube? (true/false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Restore character sprite cache
        uses: actions/cache@v4
        with:
          path: out/reel_sprites
          key: sprites-${{ hashFiles('reels/characters.py', 'reels/canvas.py') }}

      - name: Make today's reel
        env:
          # Either one works. CLAUDE_CODE_OAUTH_TOKEN uses your Claude Pro/Max subscription (`claude setup-token`).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          case "${{ github.event.schedule }}" in
            "30 3 * * *") POST=12:00 ;;
            "30 7 * * *") POST=16:00 ;;
            *)            POST=19:00 ;;
          esac
          ARGS="--type ${{ github.event.inputs.type || 'auto' }} --post-time $POST"
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then ARGS="$ARGS --no-upload"; fi
          python -m reels.pipeline $ARGS

      - name: Keep the video for 7 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: |
            out/reel.mp4
            out/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save history
        if: success()
        run: |
          git config user.name "daily-reels-bot"
          git config user.email "daily-reels-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u '+%F %H:%M') UTC"
          # if someone pushed meanwhile, replay on top of it; on a clash in state/ the bot's fresh state wins
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
