name: Daily Reel

on:
  schedule:
    # Main run at 02:00 IST (night: the Claude subscription is free then); it fills the day's slots
    # (reels/schedule.py: 12:00, 16:00 and 19:00 IST) and YouTube publishes them on time.
    # Retries at 04:00, 06:00, 08:00, 12:00 and 16:00 IST: if something stopped, they finish it; otherwise they end in seconds.
    - cron: "30 20,22,0,2,6,10 * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "auto / paheli / devotional (paheli or devotional starts a new series of that kind)"
        default: "auto"
      upload:
        description: "Upload to YouTube? (true/false). Fills the free slots of the next 24 hours."
        default: "true"

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: paheli-krishna      # this channel's own folder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}     # newest state, even if this run waited in the queue or is a re-run

      - name: Is a video due?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then DUE=$(python3 -m reels.schedule --force); else DUE=$(python3 -m reels.schedule); fi
          echo "due: $DUE"
          if [ "$DUE" = "none" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.due.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paheli-krishna/requirements.txt

      - name: Install dependencies
        if: steps.due.outputs.go == 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Restore character sprite cache
        if: steps.due.outputs.go == 'true'
        uses: actions/cache@v5
        with:
          path: paheli-krishna/out/reel_sprites
          key: sprites-${{ hashFiles('paheli-krishna/reels/characters.py', 'paheli-krishna/reels/canvas.py') }}

      - name: Make the reels
        if: steps.due.outputs.go == 'true'
        env:
          # Either one works. CLAUDE_CODE_OAUTH_TOKEN uses your Claude Pro/Max subscription (`claude setup-token`).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          TYPE="${{ github.event.inputs.type || 'auto' }}"
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then python -m reels.pipeline --type "$TYPE" --no-upload; exit 0; fi
          FORCE=""; if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="--force"; fi
          # at most 3 videos per run: YouTube's free quota allows about 6 uploads a day
          for i in 1 2 3; do
            DUE=$(python -m reels.schedule $FORCE)
            echo "due: $DUE"
            if [ "$DUE" = "none" ]; then break; fi
            read -r DAY SLOT PUBLISH <<< "$DUE"
            rm -rf out/voice
            python -m reels.pipeline --type "$TYPE" --date "$DAY" --slot "$SLOT" --post-time "$PUBLISH"
            mv out/reel.mp4 "out/reel_$i.mp4"
            TYPE=auto; FORCE=""      # a forced kind / far-away slot applies to the first video only
          done

      - name: Keep the video for 7 days (download from the run page)
        if: always() && steps.due.outputs.go == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: reel-${{ github.run_number }}
          path: |
            paheli-krishna/out/reel*.mp4
            paheli-krishna/out/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state
        if: always() && steps.due.outputs.go == 'true'
        run: |
          git config user.name "daily-reels-bot"
          git config user.email "daily-reels-bot@users.noreply.github.com"
          # runs even if a later video failed, so finished uploads are never repeated
          python3 ../tools/plan_page.py || true      # PLAN.md, the public "what comes next" page
          git add state/
          git add ../PLAN.md || true
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u '+%F %H:%M') UTC"
          # if someone pushed meanwhile, replay on top of it; on a clash in state/ the bot's fresh state wins
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
